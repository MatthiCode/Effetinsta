<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corde de mains</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="stage"></canvas>

  <div id="hint">Pince des deux mains pour tracer · relâche pour poser · recommence pour en ajouter · gratte avec tes doigts</div>

  <button id="clear" type="button">Effacer</button>

  <div id="start">
    <h1>Corde de mains</h1>
    <p>Pince le pouce et l'index de chaque main : une corde se tend entre elles.<br>
       Fais-la vibrer avec les autres doigts.</p>
    <button id="go">Activer la caméra et le son</button>
    <small id="msg"></small>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
